name: Bug
description: Something crashes, misbehaves or reads wrongly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How to reproduce
      description: The command line, the library call, or a link copied from the web app.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: bufferbench version and where you ran it (browser, Node.js version)
