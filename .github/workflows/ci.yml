name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Benchmark against NIST certified standards is current and within the gate
        run: node scripts/benchmark.ts --check
      - name: Generated docs are current
        run: node scripts/gen-docs.ts --check
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: bufferbench-*.tgz

  runtime:
    name: Installed package on Node ${{ matrix.node }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: sh scripts/smoke.sh bufferbench-*.tgz
